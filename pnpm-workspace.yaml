packages:
  - "packages/*"
allowBuilds:
  "@prisma/engines": false
  esbuild: false
  prisma: false
  sharp: false
  workerd: false
autoInstallPeers: false
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - carillon
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1 || 5.7.2
