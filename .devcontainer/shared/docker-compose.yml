services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.11.0
    container_name: tiles-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
    networks:
      - tiles-dev

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: tiles-playwright
    restart: unless-stopped
    init: true
    ipc: host
    ports:
      - "3100:3100"
    command: >
      npx -y playwright@1.58.2 run-server
      --port 3100
      --host 0.0.0.0
    networks:
      - tiles-dev

  db:
    image: postgres:18-alpine
    container_name: tiles-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: tiles
      POSTGRES_DB: tiles
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiles"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiles-dev

networks:
  tiles-dev:
    external: true

volumes:
  caddy_data:
  postgres_data:
