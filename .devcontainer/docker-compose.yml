name: tiles-${WORKSPACE}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${WORKSPACE}-app
    volumes:
      - ../..:/projects:cached
      - node_modules:/projects/${WORKSPACE}/node_modules
      - api_node_modules:/projects/${WORKSPACE}/packages/api/node_modules
      - web_node_modules:/projects/${WORKSPACE}/packages/web/node_modules
      - worker_node_modules:/projects/${WORKSPACE}/packages/image-upload-worker/node_modules
      - pnpm_store:/pnpm/store
    command: sleep infinity
    init: true
    environment:
      - NODE_ENV=development
      - WORKSPACE=${WORKSPACE}
    networks:
      - tiles-dev
    labels:
      caddy_0: ${WORKSPACE}.tiles.test
      caddy_0.tls: internal
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: api.${WORKSPACE}.tiles.test
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 3001}}"
      caddy_2: uploads.${WORKSPACE}.tiles.test
      caddy_2.tls: internal
      caddy_2.reverse_proxy: "{{upstreams 3002}}"
      caddy_3: storybook.${WORKSPACE}.tiles.test
      caddy_3.tls: internal
      caddy_3.reverse_proxy: "{{upstreams 6001}}"
      caddy_4: localhost
      caddy_4.tls: internal
      caddy_4.reverse_proxy: "{{upstreams 3000}}"

volumes:
  node_modules:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
  pnpm_store:
    name: pnpm_store

networks:
  tiles-dev:
    external: true
