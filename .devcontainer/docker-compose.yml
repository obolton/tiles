services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://tiles:tiles@db:5432/tiles
      - NODE_ENV=development
    depends_on:
      - db
    network_mode: service:db

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: tiles
      POSTGRES_DB: tiles
    ports:
      - "5432:5432"

volumes:
  postgres-data:
