services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - ca_cert
    volumes:
      - ../..:/projects:cached
      - node_modules:/projects/${WORKSPACE}/node_modules
      - api_node_modules:/projects/${WORKSPACE}/packages/api/node_modules
      - web_node_modules:/projects/${WORKSPACE}/packages/web/node_modules
      - worker_node_modules:/projects/${WORKSPACE}/packages/image-upload-worker/node_modules
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://tiles:tiles@db:5432/tiles
      - NODE_ENV=development
      - NODE_OPTIONS=--use-system-ca
    depends_on:
      - db
    network_mode: service:db
    user: node

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: tiles
      POSTGRES_DB: tiles
    ports:
      - "5432:5432"

volumes:
  postgres-data:
  node_modules:
  api_node_modules:
  web_node_modules:
  worker_node_modules:

secrets:
  ca_cert:
    file: ${CA_CERT}
