name: tiles-${WORKSPACE}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${WORKSPACE}-app
    hostname: ${WORKSPACE}
    volumes:
      - ../..:/projects:cached
      - pnpm_store:/pnpm/store
      - claude_config:/home/node/.claude
      - type: bind
        source: ./.generated/caddy
        target: /run/caddy-ca
        read_only: true
    command: sleep infinity
    init: true
    shm_size: 2gb
    environment:
      - NODE_ENV=development
      - WORKSPACE=${WORKSPACE}
      - DATABASE_NAME=${DATABASE_NAME:-${WORKSPACE}}
    extra_hosts:
      - "${WORKSPACE}.tiles.test:host-gateway"
      - "api.${WORKSPACE}.tiles.test:host-gateway"
      - "uploads.${WORKSPACE}.tiles.test:host-gateway"
      - "storybook.${WORKSPACE}.tiles.test:host-gateway"
    networks:
      - tiles-dev
    labels:
      caddy_0: ${WORKSPACE}.tiles.test
      caddy_0.tls: internal
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: api.${WORKSPACE}.tiles.test
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 3001}}"
      caddy_2: uploads.${WORKSPACE}.tiles.test
      caddy_2.tls: internal
      caddy_2.reverse_proxy: "{{upstreams 3002}}"
      caddy_3: storybook.${WORKSPACE}.tiles.test
      caddy_3.tls: internal
      caddy_3.reverse_proxy: "{{upstreams 6001}}"

volumes:
  pnpm_store:
    name: pnpm_store
  claude_config:
    name: claude_config

networks:
  tiles-dev:
    external: true
